<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script><title>АЗИ</title>
<style>
:root{--bg:#120a0a;--fg:#eee;--gold:#e9b949;--card:#1c1c20}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui;padding:12px;padding-top:max(12px,env(safe-area-inset-top))}
h2,h3{margin:6px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{background:var(--card);color:var(--fg);border:1px solid #444;border-radius:12px;padding:12px 14px;font-size:16px}
button.g{background:var(--gold);color:#111;border:0;font-weight:600}button.d{background:#4a1515}
input{background:#000;color:var(--fg);border:1px solid #444;border-radius:10px;padding:10px;width:110px;font-size:16px}
.t{background:#3a0f12;border-radius:16px;padding:10px;margin:8px 0}.s{background:var(--card);border-radius:12px;padding:8px 10px;min-width:44%;flex:1}
.s.on{outline:3px solid #3ddc84;background:#14532d}.felt.mine{background:radial-gradient(#1f8a45,#0f4a22)!important;border-color:#3ddc84!important}.s.f{opacity:.4}.m{color:#aaa;font-size:13px}
.c{display:inline-block;background:#f4f4f4;color:#111;border-radius:8px;padding:10px 8px;margin:3px;font-size:20px;font-weight:700;min-width:46px;text-align:center}
.c.r{color:#c22}.c.ok{outline:3px solid var(--gold)}.c.b{background:#333;color:#333}

.tb{position:relative;height:430px;margin:6px 0}.felt{position:absolute;inset:7% 3%;background:radial-gradient(#5a1a20,#3a0f12);border:3px solid #7a2a30;border-radius:50%}
.tb .s{position:absolute;transform:translate(-50%,-50%);flex:none;min-width:0;width:max-content;max-width:42%;text-align:center;font-size:13px;padding:6px 8px}
.mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:64%}.pot{font-size:24px;font-weight:700;color:var(--gold)}
.c.sm{font-size:15px;padding:5px 4px;min-width:32px;margin:1px;border-radius:6px}
.ks{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #333}.ks.az{color:var(--gold);font-weight:700}
.c.big{font-size:30px;padding:16px 12px;min-width:68px;margin:5px;border-radius:12px}.c.md{font-size:22px;padding:9px 7px;min-width:46px;border-radius:9px}
</style></head><body><div id=a><p>Подключение…</p></div><script>
const tg=Telegram.WebApp;tg.ready();tg.expand();
const P=new URLSearchParams(location.search);
const VER='v8';
let AC=null,snd=true,wasMine=false;try{snd=localStorage.getItem('snd')!=='0'}catch(e){}
let DING=null,unl=false;
function mkDing(){ // короткий колокольчик «тың» в виде WAV
  const sr=22050,n=Math.floor(sr*0.9),b=new ArrayBuffer(44+n*2),d=new DataView(b),w=(o,s)=>[...s].forEach((c,i)=>d.setUint8(o+i,c.charCodeAt(0)));
  w(0,'RIFF');d.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);d.setUint32(24,sr,true);d.setUint32(28,sr*2,true);d.setUint16(32,2,true);d.setUint16(34,16,true);w(36,'data');d.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){const t=i/sr,v=(Math.sin(6.2832*1319*t)*0.6+Math.sin(6.2832*2637*t)*0.25+Math.sin(6.2832*3951*t)*0.1)*Math.exp(-t*5)*Math.min(1,t*200);d.setInt16(44+i*2,v*0.8*32767,true)}
  return URL.createObjectURL(new Blob([b],{type:'audio/wav'}));
}
function unlock(){ // разблокировка звука первым касанием (требование iOS)
  try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}
  if(!unl){unl=true;try{DING=new Audio(mkDing());DING.preload='auto';DING.muted=true;const p=DING.play(),done=()=>{try{DING.pause();DING.currentTime=0;DING.muted=false}catch(e){}};if(p&&p.then)p.then(done).catch(()=>{unl=false});else done()}catch(e){unl=false}}
}
['touchstart','touchend','click'].forEach(ev=>document.addEventListener(ev,unlock,{passive:true}));
function webBeep(){try{unlock();if(AC){const t0=AC.currentTime;[[1319,0.5],[2637,0.22],[3951,0.08]].forEach(([f,a])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(a,t0+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t0+0.9);o.start(t0);o.stop(t0+0.95)})}}catch(e){}}
function beep(){ // «тың»: ваша очередь
  let ok=false;
  try{if(DING&&!DING.muted){DING.currentTime=0;const p=DING.play();if(p&&p.catch)p.catch(webBeep);ok=true}}catch(e){}
  if(!ok)webBeep();
  try{tg.HapticFeedback.notificationOccurred('warning')}catch(e){}
}
function attn(){const x=!!(S&&S.v==='t'&&(S.t.mine||S.t.canVote||S.t.offer!=null));if(x&&!wasMine&&snd)beep();wasMine=x;try{document.body.style.boxShadow=x?'inset 0 0 0 5px #3ddc84':''}catch(e){}}
function toggleSnd(){snd=!snd;try{localStorage.setItem('snd',snd?'1':'0')}catch(e){}if(snd)beep();draw()}
let watchId=null;const go=o=>{watchId=o.a==='watch'?o.id:null;send(o)};
let ws,S,last=0,pend=[],chain=Promise.resolve(),ms=null,pcs={},voiceOn=false,muted=false;
async function voiceStart(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){alert('Микрофон недоступен в этом приложении. Можно говорить через голосовой чат группы Telegram.');return}
  try{ms=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}catch(e){alert('Нет доступа к микрофону: '+(e.name||e));return}
  voiceOn=true;muted=false;send({a:'vjoin'});if(S)draw();
}
function voiceStop(){if(!voiceOn)return;voiceOn=false;send({a:'vleave'});Object.keys(pcs).forEach(closePc);if(ms){ms.getTracks().forEach(t=>t.stop());ms=null}if(S)draw()}
function toggleMute(){muted=!muted;if(ms)ms.getTracks().forEach(t=>t.enabled=!muted);draw()}
function closePc(id){if(pcs[id]){try{pcs[id].close()}catch(e){}delete pcs[id]}const a=document.getElementById('au_'+id);if(a)a.remove()}
function mkPc(id){
  closePc(id);
  const pc=new RTCPeerConnection({iceServers:(S&&S.ice)||[{urls:'stun:stun.l.google.com:19302'}]});pcs[id]=pc;
  ms.getTracks().forEach(t=>pc.addTrack(t,ms));
  pc.onicecandidate=e=>{if(e.candidate)send({a:'sig',to:id,data:{c:e.candidate}})};
  pc.ontrack=e=>{let a=document.getElementById('au_'+id);if(!a){a=document.createElement('audio');a.id='au_'+id;a.autoplay=true;a.setAttribute('playsinline','');document.body.appendChild(a)}a.srcObject=e.streams[0];if(a.play)a.play().catch(()=>{})};
  return pc;
}
async function voiceSig(m){
  if(!voiceOn||!ms)return;
  if(m.type==='peers'){for(const id of m.peers){const pc=mkPc(id);await pc.setLocalDescription(await pc.createOffer());send({a:'sig',to:id,data:{d:pc.localDescription}})}}
  else if(m.type==='left')closePc(m.id);
  else if(m.type==='data'){
    const d=m.data;let pc=pcs[m.from];
    if(d.d){
      if(d.d.type==='offer'){pc=mkPc(m.from);await pc.setRemoteDescription(d.d);await pc.setLocalDescription(await pc.createAnswer());send({a:'sig',to:m.from,data:{d:pc.localDescription}})}
      else if(pc)await pc.setRemoteDescription(d.d);
    }else if(d.c&&pc){try{await pc.addIceCandidate(d.c)}catch(e){}}
  }
}
const send=o=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(o));else if(o.a!=='ping'&&pend.length<5)pend.push(o)};
function conn(){
  if(ws&&ws.readyState<2)return;
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen=()=>{last=Date.now();ws.send(JSON.stringify({a:'auth',init:tg.initData,dev:P.get('dev'),join:tg.initDataUnsafe&&tg.initDataUnsafe.start_param}));if(watchId)ws.send(JSON.stringify({a:'watch',id:watchId}));if(voiceOn){Object.keys(pcs).forEach(closePc);ws.send(JSON.stringify({a:'vjoin'}))}};
  ws.onmessage=e=>{last=Date.now();const m=JSON.parse(e.data);if(m.v==='p')return;if(m.v==='sig'){chain=chain.then(()=>voiceSig(m)).catch(()=>{});return}S=m;draw();pend.splice(0).forEach(o=>ws.send(JSON.stringify(o)))};
  ws.onclose=()=>setTimeout(conn,1500);
}
conn();
setInterval(()=>{send({a:'ping'});if(ws&&ws.readyState===1&&Date.now()-last>20000)ws.close()},8000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(ws&&ws.readyState===1)ws.close();else conn()}});
const SU=['♠','♥','♦'],RK=['6','7','8','9','10','В','Д','К','Т'];
const cd=(c,i,ok)=>`<div class="c ${c.s?'r':''} ${ok?'ok':''}" ${ok?`onclick="send({a:'play',i:${i}})"`:''}>${RK[c.r]}${SU[c.s]}</div>`;
const v=id=>(document.getElementById(id)||{}).value;
function draw(){
  const keep={n:v('n'),amt:v('amt')};
  const A=document.getElementById('a');
  if(S.v==='x'){A.innerHTML='Откройте игру через Telegram-бота';return}
  try{A.innerHTML=S.v==='l'?lobby():table()}catch(e){A.innerHTML='Ошибка: '+e.message+'<br><button onclick="send({a:\'back\'})">В лобби</button>'}
  for(const k in keep)if(keep[k]&&document.getElementById(k))document.getElementById(k).value=keep[k];
  attn();
}
function lobby(){
  let h=`<h2>♠ АЗИ</h2><div>Ваши фишки: <b>${S.chips}</b></div>${S.err?`<p>${S.err}</p>`:''}<h3>Столы</h3>`;
  h+=S.tables.map(t=>`<div class=row style="margin:6px 0"><span>Стол ${t.id} · взнос ${t.ante} · ${t.n}/8</span><button onclick="go({a:'join',id:'${t.id}'})">Сесть</button><button onclick="go({a:'watch',id:'${t.id}'})">👁 Смотреть</button></div>`).join('')||'<p class=m>Столов нет</p>';
  h+=`<div class=row><input id=n type=number value=100><button class=g onclick="go({a:'create',n:+v('n')})">Создать стол</button></div>`;
  if(S.admin)h+=`<h3>Админ: выдача фишек</h3><input id=amt type=number placeholder="сумма (+/-)">`+S.users.map(u=>`<div class=row style="margin:6px 0"><span>${u.name} · ${u.chips}</span><button onclick="send({a:'give',to:'${u.id}',n:+v('amt')})">+ Выдать</button><button class=d onclick="send({a:'give',to:'${u.id}',n:-v('amt')})">− Забрать</button><button onclick="send({a:'give',to:'${u.id}',n:+v('amt'),set:1})">= Задать</button></div>`).join('');
  if(S.admin){
    h+='<h3>Касса</h3>'+S.users.filter(u=>u.issued).map(u=>`<div class=ks><span>${u.name}</span><b>${u.issued}</b></div>`).join('');
    h+=`<div class="ks az"><span>АЗИ (комиссия)</span><b>${S.azi||0}</b></div><div class=m style="margin-top:4px">Всего выдано: ${S.users.reduce((a,u)=>a+(u.issued||0),0)}</div>`;
  }
  if(S.adm)h+=`<div style="margin-top:14px"><button onclick="tg.openTelegramLink('https://t.me/${S.adm}')">✉️ Написать админу</button></div>`;
  h+=`<div class=m style="margin-top:14px">версия ${VER}${S.ver?' · сервер '+S.ver:''}</div>`;
  return h;
}
function table(){
  const t=S.t;t.board=t.board||[];
  const nm=id=>(t.seats.find(s=>s.id===id)||{}).name,cs=c=>cd(c).replace('class="c ','class="c sm '),cm=c=>cd(c).replace('class="c ','class="c md ');
  const n=t.seats.length,me=Math.max(0,t.seats.findIndex(s=>s.id===t.me));
  let h=`<div class=row><button onclick="voiceStop();go({a:'back'})">←</button><b>Стол ${t.id}</b><span class=m>взнос ${t.ante}</span>${t.watchers?`<span class=m>👁${t.watchers}</span>`:''}${t.seated?(voiceOn?`<button onclick="toggleMute()">${muted?'🔇':'🎙'}</button><button class=d onclick="voiceStop()">✕</button>`:`<button onclick="voiceStart()">🎤 Голос</button>`):''}<button onclick="toggleSnd()">${snd?'🔔':'🔕'}</button><span style="margin-left:auto">💰 ${S.chips}</span></div>${S.err?`<p>${S.err}</p>`:''}`;
  h+=`<div class=tb><div class="felt ${t.mine?'mine':''}"></div><div class=mid><div class=m>БАНК</div><div class=pot>${t.pot}</div>${t.high?`<div class=m>ставка ${t.high}</div>`:''}`;
  if(t.trump)h+=`<div class=m style="margin-top:4px">Козырь ${cm(t.trump)}${t.trump.r===8?'<br><b>Шоха на трассе!</b>':''}</div>`;
  if(t.board.length){const bc=t.board.length>4?cs:cm;h+='<div style="margin-top:4px">'+t.board.map(b=>`<span style="display:inline-block;margin:1px;${t.win===b.id?'outline:2px solid #e9b949;border-radius:8px;':''}"><span class=m>${nm(b.id)}</span><br>${bc(b.c)}</span>`).join('')+'</div>'+(t.win?`<div class=m><b style="color:#e9b949">${nm(t.win)} берёт</b></div>`:'')}
  h+='</div>';
  t.seats.forEach((s,i)=>{const a=(90+(i-me)*360/n)*Math.PI/180,x=50+40*Math.cos(a),y=50+42*Math.sin(a);
    h+=`<div class="s ${t.turn===s.id?'on':''} ${s.folded?'f':''}" style="left:${x}%;top:${y}%"><b>${s.voice?'🎙':''}${s.white?'⚪ ':''}${s.name}${s.dealer?' (сдаёт)':''}</b><div class=m>${s.chips}${s.wins?' · 🏆'+s.wins:''}${s.put?' · ст.'+s.put:''}</div></div>`});
  h+=`</div><div class=m>${t.mine?'<b style="color:#3ddc84">Ваш ход</b> · ':(t.turn?'Ходит '+nm(t.turn)+' · ':'')}${t.log||''}</div>`;
  const bg=x=>x.replace('class="c ','class="c big ');
  if(!t.seated)h+='<div class=m style="text-align:center;margin:8px">👁 Вы наблюдаете. Сесть можно между конами.</div>';else if(t.hand||t.phase==='bid'||t.phase==='play')h+='<h3 style="text-align:center">Ваши карты</h3><div style="text-align:center">'+(t.hand?t.hand.map((c,i)=>bg(cd(c,i,t.mine&&t.phase==='play'))).join(''):(t.phase==='bid'?'<div class="c b big">?</div>'.repeat(3):''))+'</div>';
  h+='<div class=row style="margin-top:10px;justify-content:center">';
  if(t.phase==='idle'){
    if(t.seated){
      if(t.canDeal)h+=`<button class=g onclick="send({a:'start'})">Раздать</button>`;
      else h+=`<span class=m>Раздаёт: ${t.dealer}</span>`;
      h+=`<button onclick="go({a:'leave'})">Выйти</button>`;
    }else h+=`<button class=g onclick="go({a:'join',id:'${t.id}'})">Сесть</button>`;
    h+=`<button onclick="tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent('https://t.me/${t.inv}?startapp=${t.id}')+'&text='+encodeURIComponent('Садись играть в АЗИ'))">Пригласить друзей</button>`;
  }
  if(t.phase==='bid'&&t.mine){
    const my=t.seats.find(x=>x.id===t.me)||{put:0},need=Math.max(0,t.high-my.put);
    h+=`<input id=amt type=number placeholder="сумма">`;
    if(t.option)h+=`<button class=g onclick="send({a:'raise',n:+v('amt')})">Ары</button><button onclick="send({a:'done'})">Играть</button><div class=m style="width:100%">Все уравняли вашу ставку. Один раз можно повысить (Ары) или начать игру.</div>`;
    else if(!t.looked){
      if(t.canBlind)h+=`<button class=g onclick="send({a:'blind',n:+v('amt')})">Ход</button>`;
      h+=`<button onclick="send({a:'look'})">Ашу</button><div class=m style="width:100%">${t.canBlind?'Ход: вслепую, сумма ×2, выше текущей ставки ('+t.high+'). ':(t.isDealer?'Сдающий не может ходить вслепую. ':'')}Ашу: открыть карты.</div>`;
    }else{
      if(t.high>0)h+=`<button onclick="send({a:'call'})">Тең${need?' '+need:''}</button>`;
      h+=`<button class=g onclick="send({a:'raise',n:+v('amt')})">Ары</button><button class=d onclick="send({a:'fold'})">Пас</button><div class=m style="width:100%">Ары: ваша ставка (${my.put}) + сумма должна быть выше ${t.high}.</div>`;
    }
  }
  if(t.phase==='bid'&&t.asked&&t.asked.length)h+=`<div class=m style="width:100%;text-align:center">Просят «Без»: <b>${t.asked.join(', ')}</b></div>`;
  if(t.phase==='bid'&&t.canAsk)h+=`<button onclick="send({a:'ask'})">Просить «Без»</button>`;
  if(t.phase==='bid'&&t.canWithout)h+=`<button class=d onclick="send({a:'without'})">Без</button>`;
  if(t.phase==='azivote'){
    if(t.canVote)h+=`<div class=m style="width:100%">Вы в АЗИ. Разделить: на кону останется ${t.azi.keep}, остальное поровну между игроками АЗИ (нужно согласие всех).</div><button class=g onclick="send({a:'vote',split:1})">Разделить</button><button onclick="send({a:'vote',split:0})">Оставить на кону</button>`;
    else h+=`<span class=m>Игроки АЗИ решают…</span>`;
  }
  if(t.phase==='azi'&&t.offer!=null)h+=`<button class=g onclick="send({a:'azi',yes:1})">Войти в АЗИ за ${t.offer}</button><button onclick="send({a:'azi',yes:0})">Пас</button>`;
  return h+'</div><div class=m style="text-align:center;margin-top:12px">версия '+VER+(S.ver?' · сервер '+S.ver:'')+'</div>';
}
</script></body></html>
